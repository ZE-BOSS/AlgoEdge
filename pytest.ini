# pytest configuration
#
# WHY testpaths EXISTS
# Without it pytest walks the whole repository, and two things in `backend/`
# and `scripts/` look like tests without being tests:
#
#   backend/api/routes/mt5_test.py   a file whose name ends `_test` and whose
#                                    route handlers are named `test_mt5_entry`,
#                                    `test_mt5_close` and so on. They are
#                                    FastAPI endpoints with `Depends(...)`
#                                    parameters, which pytest reads as fixtures
#                                    it cannot find - four collection errors on
#                                    every run.
#   scripts/run_forecast_test.py     a manual script, not a suite.
#
# Four errors at the end of a run is four things a real failure can hide
# behind, so collection is confined to the directory tests actually live in.
[pytest]
testpaths = tests
