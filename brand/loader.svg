<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Loading">
  <title>Loading</title>
  <defs>
    <linearGradient id="avLdLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E6B4"/>
      <stop offset="0.55" stop-color="#E4C273"/>
      <stop offset="1" stop-color="#C9963A"/>
    </linearGradient>
    <linearGradient id="avLdShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFA245"/>
      <stop offset="0.55" stop-color="#A97E28"/>
      <stop offset="1" stop-color="#835F1C"/>
    </linearGradient>
    <linearGradient id="avLdSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5"  stop-color="#FFF6DC" stop-opacity="0.85"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <path id="avLdGlyph" fill-rule="evenodd"
          d="M32 4.5 L57.5 59 L47.4 59 L42.9 48.4 L21.1 50.6 L16.6 59 L6.5 59 Z
             M26.1 41.9 L38.2 39.7 L32 24.6 Z"/>
    <clipPath id="avLdL"><rect x="0" y="0" width="32" height="64"/></clipPath>
    <clipPath id="avLdR"><rect x="32" y="0" width="32" height="64"/></clipPath>
    <clipPath id="avLdGlyphClip"><use href="#avLdGlyph"/></clipPath>
  </defs>

  <!-- A highlight travelling across struck metal, rather than a line drawing
       itself: the mark is a solid form now, so a sweep is the honest motion for
       it. `prefers-reduced-motion` leaves the mark static and fully rendered —
       a looping animation is a real accessibility problem for some people, and
       nothing here is worth that. -->
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .sheen { animation: avSweep 1.6s ease-in-out infinite; }
    }
    @media (prefers-reduced-motion: reduce) { .sheen { display: none; } }
    @keyframes avSweep {
      0%   { transform: translateX(-70px); }
      60%, 100% { transform: translateX(70px); }
    }
  </style>

  <use href="#avLdGlyph" fill="url(#avLdShade)" clip-path="url(#avLdL)"/>
  <use href="#avLdGlyph" fill="url(#avLdLit)"   clip-path="url(#avLdR)"/>
  <g clip-path="url(#avLdGlyphClip)">
    <rect class="sheen" x="-22" y="-4" width="26" height="72"
          fill="url(#avLdSheen)" transform="translateX(-70px)"/>
  </g>
</svg>
