<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Alphavantiq Capital">
  <title>Alphavantiq Capital</title>
  <defs>
    <linearGradient id="avFavLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E6B4"/>
      <stop offset="0.55" stop-color="#E4C273"/>
      <stop offset="1" stop-color="#C9963A"/>
    </linearGradient>
    <linearGradient id="avFavShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFA245"/>
      <stop offset="0.55" stop-color="#A97E28"/>
      <stop offset="1" stop-color="#835F1C"/>
    </linearGradient>
    <path id="avFavGlyph" fill-rule="evenodd"
          d="M32 4.5 L57.5 59 L47.4 59 L42.9 48.4 L21.1 50.6 L16.6 59 L6.5 59 Z
             M26.1 41.9 L38.2 39.7 L32 24.6 Z"/>
    <clipPath id="avFavL"><rect x="0" y="0" width="32" height="64"/></clipPath>
    <clipPath id="avFavR"><rect x="32" y="0" width="32" height="64"/></clipPath>
  </defs>
  <!-- The ink tile keeps the gold legible against a light browser chrome, which a
       bare mark is not, and gives the icon a defined edge on a home screen. -->
  <rect width="64" height="64" rx="14" fill="#0B1220"/>
  <g transform="translate(32,32) scale(0.8) translate(-32,-32)">
    <use href="#avFavGlyph" fill="url(#avFavShade)" clip-path="url(#avFavL)"/>
    <use href="#avFavGlyph" fill="url(#avFavLit)"   clip-path="url(#avFavR)"/>
  </g>
</svg>
